# Cloudflare Pages: sitio del medio (impactoindigena.news; vocesindigenas.org redirige).
# Se publica con `wrangler pages deploy` desde client/ (ver el workflow del frontend).
name = "vocesindigenas"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
# Desde el corte (24-nov-2026) se reenvía directo a la API. El candado es el
# secreto ORIGIN_SECRET (`wrangler pages secret put ORIGIN_SECRET`), el mismo
# que la API tiene en su App Service (server/src/middleware/originSecret.ts).
ORIGIN = "https://impactoindigena-news-api.azurewebsites.net"
