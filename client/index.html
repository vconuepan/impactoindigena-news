<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="QseCHXNru2YkgxCW3xA7d54iFsXSpVc6IiW4On0ptu0" />
    <meta name="theme-color" content="#0D5F3C" />
    <!-- Sin meta description fija: cada página pone la suya con Helmet.
         Medido el 2-nov-2026: con esta fija, las 37 rutas prerenderizadas
         llevaban DOS descripciones, y Google suele tomar la primera, que era
         esta misma en todo el sitio. Las fichas (/stories/*) las reescribe
         og.ts, que borra todas y pone la suya. -->
    <meta name="author" content="Venancio Coñuepan Mesías" />
    <!-- Google Discover / News: max-image-preview:large lets Google show the
         large image card (Discover is 100% visual). Without it, articles are
         capped/invisible in Discover — the channel that drives ~84% of traffic
         for comparable AI-native news sites. Pages that must not be indexed
         (profile, search) override this with their own noindex robots meta. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <title>Voces Indígenas - Noticias que importan a los pueblos indígenas</title>
    <!-- Sin Open Graph ni Twitter fijos: cada página pone los suyos con Helmet.
         Medido el 8-nov-2026: con estos fijos, las 35 rutas prerenderizadas
         llevaban DOS juegos (cinco, solo este), y el fijo iba primero, con el
         título de la portada y og:url a «/». LinkedIn toma la primera
         aparición (ver server/src/routes/og.ts), así que compartir cualquier
         página mostraba la tarjeta de la portada. Lo fija
         src/lib/etiquetas-sociales.test.ts. -->
    <meta property="article:author" content="Venancio Coñuepan Mesías" />
    <!-- Schema.org Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Voces Indígenas",
      "url": "https://vocesindigenas.org",
      "logo": "https://vocesindigenas.org/images/logo-horizontal.png",
      "description": "Plataforma de noticias sobre pueblos indígenas curadas con inteligencia artificial. Un programa de la Fundación KM.",
      "parentOrganization": { "@type": "NGO", "name": "Fundación KM", "url": "https://fundacionkm.org" }
    }
    </script>
    <!-- Google Fonts: Fraunces (display) + DM Sans (UI) -->
    <!-- Fraunces + DM Sans are self-hosted (@font-face in index.css) — no
         third-party font CDNs: reader IPs stay private (Ley 21.719 posture). -->
    <link rel="preload" href="/fonts/Fraunces/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMSans/dmsans-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload critical self-hosted fonts -->
    <link
      rel="preload"
      href="/fonts/Lora/Lora-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Aqui vivia el registro de un service worker. Se retiro el 6-sep-2026.
         Estaba bloqueado desde el 2-ago por la CSP (`script-src 'self'` sin
         `unsafe-inline`), asi que no hacia mas que dejar un error en la consola
         de cada lector. Y el worker que llego a instalarse en los 139 dias
         previos hacia cache-first sobre `/api/*`: ver `public/sw.js`, que ahora
         es un worker de retirada que se desinstala solo.
         Antes de volver a registrar uno, leer ese archivo. -->

    <!-- Analytics: first-party, cookieless page-view counter (/api/track).
         No third-party analytics scripts — reader IPs never leave our stack. -->
  </body>
</html>
