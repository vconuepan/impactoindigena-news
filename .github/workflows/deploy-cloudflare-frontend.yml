name: Deploy Frontend to Cloudflare Pages

# Reemplaza a deploy-azure-frontend.yml cuando el frontend pase de Azure Static
# Web Apps a Cloudflare Pages (decisión del director, 21-nov-2026: ahorra los
# US$8,88/mes del Static Web App en la suscripción FKM).
#
# Corte: 24-nov-2026. Desde aquí este es el único que publica el frontend en
# push a main; deploy-azure-frontend.yml quedó solo a mano, como vuelta atrás,
# hasta que se borre el Static Web App.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - '.github/workflows/deploy-cloudflare-frontend.yml'
  # Las paginas legales estan prerenderizadas: el 1-dic-2026 (Ley 21.719) hay
  # que republicar aunque no cambie `client/**`.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy Frontend (Cloudflare Pages)
    needs: ci
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      # Igual que en Azure: /api same-origin (lo reenvía client/functions), y el
      # prerender pide sus datos por el dominio público, con el secreto que lo
      # deja saltarse el limitador. El reenvío de Pages pasa la cabecera
      # x-prerender-token tal cual.
      - name: Build (with prerendering)
        run: npm run build --prefix client
        env:
          VITE_API_URL: ""
          PRERENDER_API_URL: "https://vocesindigenas.org"
          PRERENDER_BYPASS_TOKEN: ${{ secrets.PRERENDER_BYPASS_TOKEN }}
          VITE_R2_PUBLIC_URL: "https://pub-9cecf62dfd8c4e5e9b7b30b54cc1acba.r2.dev"
          VITE_SITE_URL: "https://vocesindigenas.org"

      # Cloudflare sirve `ruta/index.html` en `/ruta/` y redirige `/ruta` → `/ruta/`;
      # los canonical dicen `/ruta`. El script los deja como `ruta.html`.
      - name: Pretty URLs sin barra final
        run: node client/scripts/cloudflare-urls-sin-barra.mjs client/dist

      # Sin las claves de Cloudflare en el repo no se puede publicar: se avisa
      # y no se cae el workflow (mientras tanto se publica desde el Mac).
      - name: Claves de Cloudflare presentes
        id: claves
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "hay=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Faltan CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID: no se publica en Pages"; echo "hay=false" >> "$GITHUB_OUTPUT"; fi

      # Sin claves, el build (que sí tiene PRERENDER_BYPASS_TOKEN) queda como
      # artefacto para publicarlo a mano con `wrangler pages deploy` desde client/.
      - name: Guardar el build para publicarlo a mano
        if: steps.claves.outputs.hay != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: voces-dist
          path: client/dist
          retention-days: 7

      # Se publica desde client/ para que entren functions/ y wrangler.toml.
      - name: Deploy to Cloudflare Pages
        if: steps.claves.outputs.hay == 'true'
        uses: cloudflare/wrangler-action@v4  # la misma que usa tierrasindigenas
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: pages deploy dist --project-name vocesindigenas --branch main
