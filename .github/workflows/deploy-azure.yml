name: Deploy Backend to Azure

# GitHub builds the server (devDeps + tsc work here) and ships node_modules.
# The App Service runs with WEBSITE_RUN_FROM_PACKAGE=1 so Azure mounts the
# deployed zip read-only and uses the exact built node_modules — including the
# native @napi-rs/canvas (Instagram carousel) and Prisma engine — instead of
# letting Oryx compress node_modules (which silently dropped @napi-rs/canvas).
# Logs go to LOG_DIR=/home/LogFiles/app (writable) since wwwroot is read-only
# under run-from-package.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch: {}

# El GITHUB_TOKEN queda en solo-lectura: ninguno de estos jobs escribe en el
# repositorio. Los deploys se autentican contra Azure con sus propios
# secretos. Sin esto hereda los permisos del repositorio, que hoy son de
# escritura y con capacidad de aprobar pull requests.
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    # Fijo en 24.04: `ubuntu-latest` pasa a Ubuntu 26 el 19-oct-2026 (ver ci.yml).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/db'

      - name: Build
        run: npm run build --prefix server

      - name: Prune dev dependencies
        run: npm prune --prefix server --production

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: impactoindigena-news-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server/
