name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - '.github/workflows/deploy-azure-frontend.yml'
  # Disparo manual: las paginas legales estan prerenderizadas y el 1-dic-2026
  # (Ley 21.719) hay que republicar el frontend aunque no cambie `client/**`.
  workflow_dispatch: {}

# El GITHUB_TOKEN queda en solo-lectura: ninguno de estos jobs escribe en el
# repositorio. Los deploys se autentican contra Azure con sus propios
# secretos. Sin esto hereda los permisos del repositorio, que hoy son de
# escritura y con capacidad de aprobar pull requests.
permissions:
  contents: read

jobs:
  # El mismo CI de ci.yml, en esta corrida y sobre este commit. Si falla, no
  # se despliega. Antes del 6-nov-2026 el deploy no lo esperaba.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy Frontend
    needs: ci
    # Fijo en 24.04: `ubuntu-latest` pasa a Ubuntu 26 el 19-oct-2026, y el Chrome
    # del prerender depende de librerias del sistema (ver abajo).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # Build in the runner (not Oryx) so the prerender plugin's bundled
      # Chrome has the system libraries it needs. Oryx's build container
      # lacks libnspr4.so and fails the prerender step.
      - name: Install dependencies
        run: npm ci --prefix client

      # The backend is locked behind the SWA linked-backend proxy (Easy Auth),
      # so it only accepts traffic through the SWA. Runtime calls therefore use
      # VITE_API_URL="" (same-origin /api → proxied), which also keeps auth
      # cookies same-origin. The prerender step can't reach the backend
      # directly, so it fetches slugs through the SWA public proxy URL via
      # PRERENDER_API_URL.
      - name: Build (with prerendering)
        run: npm run build --prefix client
        env:
          VITE_API_URL: ""
          PRERENDER_API_URL: "https://calm-pebble-039bfb80f.7.azurestaticapps.net"
          # El secreto con que el prerender se salta el limitador publico de la
          # API (B23, 10-nov-2026): un build hacia 204 consultas en dos minutos
          # contra un limite de 100 cada 15 minutos por IP, y desde la 101 las
          # paginas se horneaban en esqueleto. Tiene que ser IGUAL al app setting
          # PRERENDER_BYPASS_TOKEN del App Service. Si falta, el build cuenta
          # contra el limite como cualquiera y, si lo agota, el candado de
          # vite.config.ts lo detiene antes de desplegar. Solo lo lee Node: no
          # es VITE_*, asi que no entra al bundle.
          PRERENDER_BYPASS_TOKEN: ${{ secrets.PRERENDER_BYPASS_TOKEN }}
          # El bucket publico de R2, de donde el cliente lee el snapshot de la
          # portada en vez de pedirlo al backend. Es publico por definicion —ya
          # sirve todas las imagenes del sitio— asi que no es un secreto.
          VITE_R2_PUBLIC_URL: "https://pub-9cecf62dfd8c4e5e9b7b30b54cc1acba.r2.dev"
          # El dominio publico del sitio, que alimenta canonicas, og:image y el
          # sitemap. Va aca y no en el codigo: hasta el 4-sep-2026 estaba escrito
          # a mano en `seo.tsx` apuntando a un dominio que todavia devolvia el 403
          # de HostGator, asi que cualquier despliegue habria publicado canonicas
          # rotas. Cambiar de dominio no deberia exigir un commit de codigo.
          VITE_SITE_URL: "https://vocesindigenas.org"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client/dist
          output_location: ""
          skip_app_build: true
