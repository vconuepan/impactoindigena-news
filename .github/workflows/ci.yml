name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Los dos deploys llaman a este mismo workflow y despliegan solo si pasa.
  # Hasta el 6-nov-2026 corrian en paralelo con el CI y no lo esperaban: el
  # 4-nov un CI en rojo (5f729e0) desplego igual a produccion.
  workflow_call: {}

# El GITHUB_TOKEN queda en solo-lectura: ninguno de estos jobs escribe en el
# repositorio. Los deploys se autentican contra Azure con sus propios
# secretos. Sin esto hereda los permisos del repositorio, que hoy son de
# escritura y con capacidad de aprobar pull requests.
permissions:
  contents: read

# `ubuntu-24.04` fijo y no `ubuntu-latest`: GitHub mueve esa etiqueta a Ubuntu 26
# desde el 19-oct-2026, y el prerender del cliente depende de librerias del
# sistema (ver deploy-azure-frontend.yml). Subir de version se hace a proposito.
# Instalar con `npm ci` y no `npm install`: lo que se prueba es exactamente lo
# que el deploy instala; `npm install` corregiria en silencio un lockfile
# desalineado y el CI pasaria con dependencias distintas a las de produccion.
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)
        with:
          fetch-depth: 0
      # La CLI de gitleaks, no `gitleaks/gitleaks-action`. El 25-nov-2026 el repo
      # paso a la organizacion Fundacion-KM y la action exige una licencia
      # (GITLEAKS_LICENSE) en repos de organizaciones: el escaneo fallo sin mirar
      # un solo commit y dejo sin desplegar el backend y el frontend, que
      # dependen de este CI. La CLI es la misma herramienta y lee el mismo
      # `.gitleaks.toml`; recorre todo el historial (fetch-depth 0), que es mas
      # estricto que el rango del push que miraba la action.
      #
      # Version fijada: la 8.24.3 marca server/.env.sample pese al allowlist; la
      # 8.30.1 da 0 hallazgos en los 1.136 commits (medido el 25-nov-2026). El
      # hash es el del checksums.txt oficial de la release: si no coincide, el
      # paso falla antes de ejecutar nada.
      - name: gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --config .gitleaks.toml .

  test-server:
    name: Server tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        run: npm run db:generate --prefix server
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/db?schema=public'

      # El build del deploy ya corre `tsc`, pero solo despues de decidir
      # desplegar; aca el error de tipos del servidor frena antes.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: server

      - name: Run tests
        run: npm test --prefix server

  test-client:
    name: Client tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Run tests
        run: npm test --prefix client

  typecheck-client:
    name: Client typecheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Typecheck
        run: npx tsc -b --noEmit
        working-directory: client
