name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El GITHUB_TOKEN queda en solo-lectura: ninguno de estos jobs escribe en el
# repositorio. Los deploys se autentican contra Azure con sus propios
# secretos. Sin esto hereda los permisos del repositorio, que hoy son de
# escritura y con capacidad de aprobar pull requests.
permissions:
  contents: read

# `ubuntu-24.04` fijo y no `ubuntu-latest`: GitHub mueve esa etiqueta a Ubuntu 26
# desde el 19-oct-2026, y el prerender del cliente depende de librerias del
# sistema (ver deploy-azure-frontend.yml). Subir de version se hace a proposito.
# Instalar con `npm ci` y no `npm install`: lo que se prueba es exactamente lo
# que el deploy instala; `npm install` corregiria en silencio un lockfile
# desalineado y el CI pasaria con dependencias distintas a las de produccion.
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)
        with:
          fetch-depth: 0
      # v3 solo cambia el runtime a node24; mismas entradas y salidas que v2.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0 (node24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-server:
    name: Server tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        run: npm run db:generate --prefix server
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/db?schema=public'

      - name: Run tests
        run: npm test --prefix server

  test-client:
    name: Client tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Run tests
        run: npm test --prefix client

  typecheck-client:
    name: Client typecheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0 (node24)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Typecheck
        run: npx tsc -b --noEmit
        working-directory: client
